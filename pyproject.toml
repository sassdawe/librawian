[project]
name = "librawian"
version = "0.1.0"
description = "Scan book ISBN barcodes from a webcam into an open Excel workbook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python==4.13.0.92",
    "pyzbar==0.1.9",
    "xlwings==0.37.7 ; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.gui-scripts]
librawian = "librawian.app:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
